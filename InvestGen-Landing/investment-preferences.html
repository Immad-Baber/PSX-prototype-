<!DOCTYPE html>

<html data-theme="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>InvestOPak | Investment Preferences</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Outfit:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="css/style.css?v=3" rel="stylesheet"/>
</head>
<body class="dashboard-body">
<aside class="sidebar">
<div class="sidebar-header"><a class="logo" href="index.html">Invest<span>OPak</span></a></div>
<ul class="sidebar-nav">
<li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
<li><a href="market-overview.html"><i class="fas fa-globe"></i> Market Overview</a></li>
<li><a href="screener-demo.html"><i class="fas fa-robot"></i> AI Screener</a></li>
<li><a href="portfolio.html"><i class="fas fa-briefcase"></i> Portfolio</a></li>
<li><a href="all-stocks.html"><i class="fas fa-list"></i> All Stocks</a></li>
<li><a href="calibration.html"><i class="fas fa-tachometer-alt"></i> Calibration</a></li>
<li><a href="watchlist.html"><i class="fas fa-star"></i> Watchlist</a></li>
</ul>
<div class="sidebar-footer"><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></div>
</aside>
<div class="main-wrapper">
<header class="top-nav">
<div class="search-bar"><i class="fas fa-search"></i><input placeholder="Search ticker or company..." type="text"/></div>
<div class="top-nav-actions">
<button id="theme-toggle"><i class="fas fa-moon"></i></button>
<a class="nav-icon-btn" href="notifications.html"><i class="fas fa-bell"></i><span class="badge">2</span></a>
<a class="user-profile" href="profile.html" style="text-decoration: none; color: inherit;"><div class="avatar">IB</div><span>Immad Baber</span></a>
</div>
</header>
<main class="dashboard-content">
<div class="welcome-header">
<h1>Investment Onboarding</h1>
<p class="market-status">Provide your preferences so the Multi-Agent system can generate a customized portfolio strategy.</p>
</div>
<div class="widget-card" style="max-width: 600px;">
<div class="widget-body">
<form action="recommendations.html" method="GET">
<div class="form-group">
<label>Available Capital (PKR)</label>
<input placeholder="e.g., 1000000" required="" type="number"/>
</div>
<div class="form-group">
<label>Target Dividend Range</label>
<select style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
<option>0% - 3% (Aggressive Growth)</option>
<option>3% - 8% (Balanced / Value)</option>
<option>8%+ (Income Focused)</option>
</select>
</div>
<div class="form-group">
<label>Risk Tolerance</label>
<select style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
<option>Low (Blue-chip only)</option>
<option>Medium</option>
<option>High (Includes high-<span class="has-tip">volatility<span class="tip-box">The rate at which the price of a stock increases or decreases.</span></span> regimes)</option>
</select>
</div>
<button class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem;" type="submit">Generate My Strategy</button>
</form>
</div>
</div>
</main>
</div>
<script src="js/main.js"></script>
</body>
</html>
