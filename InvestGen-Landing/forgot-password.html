<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestOPak | Password Recovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="css/style.css?v=4"/>
</head>
<body class="auth-page">
    <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
        <button id="theme-toggle" aria-label="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="logo">Invest<span>OPak</span></a>
            <p>Terminal Password Recovery</p>
        </div>

        <form action="login.html" method="GET">
            <div class="form-group">
                <label for="email">Registered Work Email</label>
                <input type="email" id="email" name="email" required placeholder="name@company.com">
                <span style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 0.35rem;">A verification link with one-time reset code will be transmitted.</span>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; height: 38px; font-weight: 600; margin-top: 0.5rem;">
                <i class="fas fa-paper-plane"></i> Transmit Reset Link
            </button>
        </form>

        <div class="auth-footer">
            Remembered your credentials? <a href="login.html" style="font-weight: 600;">Back to Sign In</a>
        </div>
    </div>

    <script src="js/main.js?v=2"></script>
</body>
</html>
