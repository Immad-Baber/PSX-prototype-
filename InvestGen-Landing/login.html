<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestGen | Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-primary);">
    <div style="position: absolute; top: 2rem; right: 2rem;">
        <button id="theme-toggle" aria-label="Toggle Theme" style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-primary);">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="contact-form" style="width: 100%; max-width: 450px; margin: 0 1rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="index.html" class="logo" style="font-size: 2rem;">Invest<span>Gen</span></a>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Welcome back. Please log in to your account.</p>
        </div>

        <form action="dashboard.html" method="GET">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            
            <div class="form-group">
                <label for="password" style="display: flex; justify-content: space-between;">
                    Password
                    <a href="forgot-password.html" style="font-size: 0.85rem; font-weight: normal;">Forgot password?</a>
                </label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1rem; margin-top: 1rem;">Log In</button>
        </form>

        <p style="text-align: center; margin-top: 2rem; font-size: 0.95rem; color: var(--text-secondary);">
            Don't have an account? <a href="signup.html">Sign up</a>
        </p>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
