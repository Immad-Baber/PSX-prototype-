<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestOPak | Terminal Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="css/style.css?v=4"/>
</head>
<body class="auth-page">
    <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
        <button id="theme-toggle" aria-label="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="logo">Invest<span>OPak</span></a>
            <p>Institutional Market Intelligence Terminal</p>
        </div>

        <form action="dashboard.html" method="GET">
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" name="email" required placeholder="name@company.com" value="immadbaber@gmail.com">
            </div>
            
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.35rem;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                    <a href="forgot-password.html" style="font-size: 0.78rem;">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" required placeholder="••••••••" value="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 38px; font-weight: 600; margin-top: 0.5rem;">
                <i class="fas fa-arrow-right-to-bracket"></i> Sign In to Terminal
            </button>
        </form>

        <div style="margin-top: 1.25rem; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center;">
            <span style="color: var(--text-secondary);"><i class="fas fa-user-check" style="color: var(--bullish);"></i> Demo Account Ready</span>
            <a href="dashboard.html" class="badge badge-blue" style="text-decoration: none;">Auto-fill &amp; Enter</a>
        </div>

        <div class="auth-footer">
            Don't have an institutional account? <a href="signup.html" style="font-weight: 600;">Create Account</a>
        </div>
    </div>

    <script src="js/main.js?v=2"></script>
</body>
</html>
